name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Check release credentials
    runs-on: ubuntu-latest
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select macOS signing mode and require updater credentials
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { macSigningMode } from './scripts/release-build.mjs';
          const mode = macSigningMode(process.env);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `mode=${mode}\n`);
          console.log(mode === 'notarized' ? '使用 Developer ID 签名和 Apple 公证' : '无 Apple 证书：使用临时签名，首次打开需按发布说明手动放行');
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
            throw new Error('缺少 TAURI_SIGNING_PRIVATE_KEY，无法生成有效的自动更新签名。');
          }
          JS

  build:
    needs: validate
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - platform: macos-latest
            label: macOS Apple Silicon
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            label: macOS Intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri CLI 自动导入 p12 到临时钥匙串，并提交 Apple 公证、装订票据。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npm run release:build
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: VarSwitch ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          uploadUpdaterJson: false
          # Tauri 给 macOS updater 包的原生命名是 VarSwitch.app.tar.gz，不含架构，
          # 两个 macOS matrix 作业会上传同名资源并互相覆盖。加入 [arch] 后：
          #   VarSwitch_x.y.z_x64-setup.exe / VarSwitch_x.y.z_aarch64.dmg
          #   VarSwitch_x.y.z_aarch64.app.tar.gz / VarSwitch_x.y.z_x64.app.tar.gz
          releaseAssetNamePattern: '[name]_[version]_[arch][setup][ext]'
          releaseBody: |
            ## 下载

            | 系统 | 安装包 |
            | --- | --- |
            | Windows 10/11 (x64) | `VarSwitch_*_x64-setup.exe` |
            | macOS (M1/M2/M3/M4) | `VarSwitch_*_aarch64.dmg` |
            | macOS (Intel) | `VarSwitch_*_x64.dmg` |

            ${{ needs.validate.outputs.signing_mode == 'notarized' && 'macOS 安装包已使用 Developer ID 签名并通过 Apple 公证。' || 'macOS 安装包使用临时签名，已检查完整性，但未通过 Apple 公证，首次打开可能被系统拦截。' }}

            将 App 拖入「应用程序」。无证书版本如提示「已损坏」，确认从本项目下载后，在终端执行：

            ```bash
            codesign --verify --deep --strict /Applications/VarSwitch.app && xattr -rd com.apple.quarantine /Applications/VarSwitch.app
            ```

            此操作仅针对 VarSwitch，不修改系统 Gatekeeper 设置；签名完整性校验失败时应重新下载。

      - name: Verify updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          else
            dir="src-tauri/target/release/bundle/nsis"
          fi
          shopt -s nullglob
          sigs=("$dir"/*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::error::${dir} 下没有找到 .sig 文件，该平台的自动更新将不可用。"
            ls -la "$dir" || true
            exit 1
          fi
          printf '找到更新签名: %s\n' "${sigs[@]}"

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble one updater manifest after all builds finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_dir="$RUNNER_TEMP/varswitch-release"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$release_dir" \
            --pattern "VarSwitch_${version}_x64-setup.exe" \
            --pattern "VarSwitch_${version}_aarch64.app.tar.gz" \
            --pattern "VarSwitch_${version}_x64.app.tar.gz" \
            --pattern "VarSwitch_${version}_x64-setup.exe.sig" \
            --pattern "VarSwitch_${version}_aarch64.app.tar.gz.sig" \
            --pattern "VarSwitch_${version}_x64.app.tar.gz.sig"
          node scripts/create-updater-manifest.mjs "$RELEASE_TAG" "$release_dir" > "$RUNNER_TEMP/latest.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/latest.json#latest.json" --repo "$GH_REPO" --clobber
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { readReleaseNotes, releaseBody } from './scripts/release.mjs';
          const file = path.join(process.env.RUNNER_TEMP, 'release-body.md');
          fs.writeFileSync(file, releaseBody(readReleaseNotes(process.env.RELEASE_TAG), fs.readFileSync(file, 'utf8')));
          JS
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --notes-file "$RUNNER_TEMP/release-body.md" --draft=false
