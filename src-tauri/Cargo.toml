[package]
name = "varswitch"
version = "3.2.3"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
# Claude 本地协议转换代理的 HTTP 服务器（同步模型，无 async 依赖）
tiny_http = "0.12"
tauri-plugin-dialog = "2"
qrcode = "0.14"
image = "0.25"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 单实例：重复点击图标时聚焦已有窗口，而不是再启动一个进程
# deep-link feature：Windows 深链会拉起第二个进程，该 feature 让插件在回调前
# 自动把 argv 里的 varswitch:// URL 转发给 deep-link 插件（触发 on_open_url）
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-deep-link = "2.4.9"
# 全局快捷键：一键显示/隐藏主窗口（快捷键内容在应用设置中配置）
tauri-plugin-global-shortcut = "2"
keyring = "4"
aes-gcm = { version = "0.11", features = ["rand_core"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
tauri-build = { version = "2", features = [] }
